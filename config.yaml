# Exportaciones estándar de ARCA "Comprobantes de Compras" y
# Odoo "Libro de IVA argentino".
# Los números de fila son los que se ven en Excel (comienzan en 1).
origen_sheet: "Sheet1"
destino_sheet: "Libro de IVA argentino"
finnegans_sheet: "hoja1"

mapping:
  afip:
    header_row: 2
    n_comp_mode: "build"
    tipo: "Tipo"
    pv: "Punto de Venta"
    num: "Número Desde"
    build_pattern: "{doc_type}-{letter}{pv:05d}{num:08d}"
    date: "Fecha"
    cuit: "Nro. Doc. Vendedor"
    currency: "Moneda"
    exchange_rate: "Tipo Cambio"
    importes:
      exento:
        - "No Gravado"
        - "Exento"
      neto: "Neto Gravado"
      iva: "IVA"
      total: "Total"

  odoo:
    header_row: 3
    n_comp_mode: "column"
    # En el reporte de Odoo esta columna no tiene encabezado.
    n_comp_column: "A"
    date: "Fecha"
    cuit: "CUIT"
    nombre: "Nombre"
    importes:
      # Importes que no forman parte del neto gravado ni del IVA discriminado.
      exento:
        - "No gravado"
        - "Perc. IVA"
        - "Perc. IIBB"
        - "Gcia. perc."
        - "Municipales"
        - "Otros impuestos"
      neto: "Gravado"
      iva:
        - "IVA 2,5%"
        - "IVA 5%"
        - "IVA 10,5%"
        - "IVA 21%"
        - "IVA 27%"
      total: "Total"

  finnegans:
    header_row: 1
    date: "Fecha"
    document: "Documento"
    n_comp_column: "Comprobante"
    cuit: "Cuit"
    importes:
      exento: "Otros"
      neto: "Imponible"
      iva: "Impuesto"
      total: "Total"

columns:
  - name: "IMP_EXENTO"
    type: "number"
    tolerance: 0.01
  - name: "IMP_NETO"
    type: "number"
    tolerance: 0.01
  - name: "IMP_IVA"
    type: "number"
    tolerance: 0.01
  - name: "IMP_TOTAL"
    type: "number"
    tolerance: 0.01

output_file: "outputs/odoo_validado.xlsx"
